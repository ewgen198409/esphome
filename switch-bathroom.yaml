esphome:
  name: switch-bathroom

esp8266:
  board: d1_mini
  restore_from_flash: true

logger:

api:
  reboot_timeout: 0s
  encryption:
    key: "x3CRC91sDNSAUUCrCYm/qz2gvVJJ/RKmtD/Wq1g8hXQ="

ota:
  - platform: esphome
    password: "f4050abea6ea206d17a1cb68fbb73c04"

wifi:
  min_auth_mode: WPA2
  <<: !include networks.yaml


text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address
    ssid:
      name: SSID

button:
  - platform: restart
    name: Restart 
    id: reboot

sensor:
  - platform: dht
    pin: GPIO4
    model: DHT11
    temperature:
      name: "Bathroom Temperature"
      accuracy_decimals: 1
    humidity:
      name: "Bathroom Humidity"
      accuracy_decimals: 1
    update_interval: 30s

output:
  # Подсветка кнопки (PWM) - GPIO13
  - platform: esp8266_pwm
    pin: GPIO13
    id: backlight_pwm
    frequency: 1000Hz

  # Реле 1 и 2 (Свет) - тип Реле_i (Инвертированные) 
  - platform: gpio
    pin: { number: GPIO0, inverted: true }
    id: relay_1_output

  - platform: gpio
    pin: { number: GPIO2, inverted: true }
    id: relay_2_output

light:
  # Подсветка (PWM) - управление яркостью
  - platform: monochromatic
    output: backlight_pwm
    name: "Switch Backlight"
    id: backlight
    restore_mode: RESTORE_DEFAULT_ON
    effects:
      - pulse:
          name: "Fast Pulse"
          transition_length: 0.2s
          update_interval: 0.2s
          min_brightness: 0%
          max_brightness: 100%
      - pulse:
          name: "Slow Pulse"
          transition_length: 1000ms
          update_interval: 2s

  - platform: status_led
    name: "Status led"
    internal: True
    pin:
      number: GPIO12
      inverted: false


  # Реле 1 и 2 (Свет) - тип Реле_i (Инвертированные) 
  - platform: binary
    output: relay_1_output
    name: "Light 1"
    id: light_1
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: binary
    output: relay_2_output
    name: "Light 2"
    id: light_2
    restore_mode: RESTORE_DEFAULT_OFF

script:
  # Авто-гашение подсветки, если жест кнопки не распознан (страховка от залипания)
  - id: backlight_timeout
    then:
      - delay: 2s
      - if:
          condition:
            light.is_on: backlight
          then:
            - light.turn_off: backlight

binary_sensor:
  # Датчик движения (Свич_n - инвертированный) 
  - platform: gpio
    pin: 
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: false
    name: "Bathroom Motion"
    device_class: motion

  # Кнопка (GPIO14) с полной логикой ваших Rules [cite: 1, 2]
  - platform: gpio
    id: bathroom_button
    name: "Bathroom Button"
    internal: false
    filters:
      - delayed_on_off: 50ms
    pin:
      number: GPIO14
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      then:
        - light.turn_on:
            id: backlight
            effect: "Fast Pulse"
        # Страховка от «залипания» подсветки: если жест не распознан
        # (мёртвая зона, медленный двойной и т.п.), гасим её через 2с.
        - script.stop: backlight_timeout
        - script.execute: backlight_timeout

    on_multi_click:
      # Одинарное нажатие: тап < 1.2с, затем пауза >= 0.45с
      - timing:
          - ON for at most 1.2s
          - OFF for at least 0.45s
        then:
          - script.stop: backlight_timeout
          - light.turn_off: backlight
          - light.turn_on: light_1

      # Двойное нажатие: клики быстрые (пауза <= 0.35с)
      - timing:
          - ON for at most 1.2s
          - OFF for at most 0.35s
          - ON for at most 1.2s
          - OFF for at least 0.45s
        then:
          - script.stop: backlight_timeout
          - light.turn_off: backlight
          - light.turn_on: light_2

      # Тройное нажатие: два быстрых клика + третий
      # (независимый триггер двойного тоже сработает на 3-м нажатии,
      #  но действие безвредно: обе лампы всё равно включаются)
      - timing:
          - ON for at most 1.2s
          - OFF for at most 0.35s
          - ON for at most 1.2s
          - OFF for at most 0.35s
          - ON for at most 1.2s
          - OFF for at least 0.45s
        then:
          - script.stop: backlight_timeout
          - light.turn_off: backlight
          - light.turn_on: light_1
          - light.turn_on: light_2

      # Удержание ~1.3с: выключить свет (мёртвая зона между тапом и
      # удержанием теперь всего 1.2–1.3с, а не 0.5–1.0с)
      - timing:
          - ON for at least 1.3s
        then:
          - script.stop: backlight_timeout
          - light.turn_off: light_1
          - light.turn_off: light_2
          - light.turn_on:
              id: backlight
              effect: "Slow Pulse"

      # Удержание >= 5с: перезагрузка.
      # ВНИМАНИЕ: триггеры независимы, поэтому при удержании до 5с сначала
      # (на ~1.3с) сработает «выключить свет» выше, затем уже reboot.
      - timing:
          - ON for at least 5s
        then:
          - script.stop: backlight_timeout
          - light.turn_off: backlight
          - button.press: reboot
